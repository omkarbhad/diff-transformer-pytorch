[project]
name = "diff-transformer-pytorch"
version = "0.1.0"
description = "Differential Transformer (Ye et al., 2024) in PyTorch: attention as the difference of two softmax maps, with a parameter-matched baseline."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["diff_transformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
